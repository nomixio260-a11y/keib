# 自動更新（止まらない版）。GitHub の schedule は頻繁に落ちる（10分ごとの指定で1日2回、毎時の指定も動かない日があった）ので、
# 1回の実行の中で「JRA から取り込み → data ブランチに data.json を push」を繰り返し、実行時間の上限（約6時間）が近づいたら
# 自分で次の実行を予約する（workflow_dispatch）。schedule は止まったときの再開用。
# 画面（GitHub Pages）は data ブランチの data.json を読むので、Pages を公開し直さなくても更新される。
#
#   取り込みの間隔は build-data が状況から決める（NEXT=秒）：
#     - 今日の未確定レースの発走 90分前から結果が出るまで … 5分ごと
#     - それ以外の開催日・前日発売中（24時間以内に発走）… 20分ごと
#     - 深夜（JST 0〜7時）・開催がなく出馬表にも変化がない … 1時間ごと（開催一覧を1回見るだけ）
#   手動：Actions → Race day → Run workflow（分と間隔を指定すると固定。relay=1 なら終了後に次を予約して自動運転に戻る）
#   止めるとき：Actions → Race day → … → Disable workflow（実行中の run も Cancel）
#   data ブランチには data.json のほか、オッズの推移（odds/）と結果の記録（history/。直近400日）も貯める（1コミットを上書き）。
#   発走前の買い目の記録（picks/。標準の設定で、発走1分前を過ぎたレースは書き換えない）も貯める。画面の「検証」が実際の払戻で精算する。
#   特別登録（日曜の夕方〜）から来週の特別レースの暫定の予想も入れる（--registrations。出馬表が出たら置き換わる）。
#   特別登録の馬の前4走は history/ の結果の記録で詳しくする（タイム・通過順・上がり。ないときは馬柱の着順と距離だけ）。
#   過去の開催日は、直近14日を data.json に入れ、それより前は days/（開催日ごとのアーカイブ。結果の出そろった日を自動で書き足す）から画面が読み込む
name: Race day

on:
  schedule:
    - cron: '7 * * * *' # 毎時7分：止まっていれば再開（動いていれば順番待ちになり、その実行が終わると引き継ぐ）
    - cron: '35 23 * * 5,6' # 予備：土日 08:35 JST
    - cron: '55 4 * * 6,0' # 予備：土日 13:55 JST
  workflow_dispatch:
    inputs:
      minutes:
        description: '動かす時間（分、最大 345。空なら上限まで）'
        default: ''
        required: false
      interval:
        description: '取り込みの間隔（秒。空なら状況から自動）'
        default: ''
        required: false
      relay:
        description: '終了後に次の実行を予約する（1 で有効）'
        default: '1'
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: race-day
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: data ブランチを用意する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin data:data 2>/dev/null; then
            git worktree add out data
            echo "data ブランチを取得しました"
          else
            git worktree add --detach out
            git -C out checkout -q --orphan data
            git -C out rm -rfq . || true
            echo "data ブランチを新しく作ります"
          fi
          # 前回のデータがなければ公開先の data.json を引き継ぐ
          if [ ! -s out/data.json ]; then
            curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json" -o out/data.json || true
          fi
      - name: 取り込みと公開を繰り返す
        env:
          INPUT_MINUTES: ${{ github.event.inputs.minutes }}
          INPUT_INTERVAL: ${{ github.event.inputs.interval }}
        run: |
          start=$(date -u +%s)
          cap=$((start + 345 * 60))
          end=$cap
          if [ -n "$INPUT_MINUTES" ]; then end=$((start + INPUT_MINUTES * 60)); [ "$end" -gt "$cap" ] && end=$cap; fi
          echo "終了予定 $(date -u -d @$end +%FT%TZ)（$(( (end - start) / 60 ))分）・間隔 ${INPUT_INTERVAL:-自動}"
          n=0
          while :; do
            n=$((n + 1))
            echo "== $n 回目 $(date -u +%FT%TZ)"
            # ほかから data ブランチに push されたもの（過去の結果の記録など）を取り込む
            if git -C out fetch -q origin data 2>/dev/null; then git -C out reset -q --hard FETCH_HEAD; fi
            args="--out out/data.json --snapshots out/odds --records out/history --history out/history --history-keep-days 400 --exotic out/odds-final --days-dir out/days --picks out/picks --registrations --skip-if-idle"
            [ -s out/data.json ] && args="$args --previous out/data.json"
            if node scripts/build-data.mjs $args > build.log 2>&1; then
              tail -12 build.log
            else
              tail -30 build.log
              echo "取り込みに失敗（次の回で再試行）"
            fi
            next=$(grep -o 'NEXT=[0-9]*' build.log | tail -1 | cut -d= -f2)
            next=${next:-900}
            [ -n "$INPUT_INTERVAL" ] && next=$INPUT_INTERVAL
            if [ -n "$(git -C out status --porcelain)" ]; then
              git -C out add -A
              if git -C out rev-parse --verify HEAD >/dev/null 2>&1; then
                git -C out commit -q --amend -m "data $(date -u +%FT%TZ)"
              else
                git -C out commit -q -m "data $(date -u +%FT%TZ)"
              fi
              for i in 1 2 3; do git -C out push -q -f origin HEAD:data && break || sleep 10; done
              echo "data ブランチを更新しました"
            else
              echo "変化なし"
            fi
            now=$(date -u +%s)
            # 次の回が終了予定を越えるなら終わる（次の実行が引き継ぐ）
            [ $((now + next)) -ge "$end" ] && break
            echo "次は ${next}秒後"
            sleep "$next"
          done
          echo "終了 $(date -u +%FT%TZ)（$n 回）"
      - name: 次の実行を予約する（schedule が落ちても止まらないように）
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.relay == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 直近1時間に 4回以上始まっていたら（失敗の繰り返し）予約しない。schedule が次の毎時に再開する
          since=$(date -u -d '-1 hour' +%FT%TZ)
          recent=$(gh run list --workflow race-day.yml --created ">=$since" --json databaseId --jq 'length' 2>/dev/null || echo 0)
          if [ "${recent:-0}" -ge 4 ]; then echo "直近1時間に ${recent}回：予約しない"; exit 0; fi
          gh workflow run race-day.yml --ref "$GITHUB_REF_NAME" -f relay=1
          echo "次の実行を予約しました"
