# GitHub Pages に、実データ（JRA の出馬表・オッズ・結果）つきで公開する。
#
#   - 開催日（土日・月曜）の 9:00〜17:59 JST は10分ごと、金土日の夜（前日オッズ）は30分ごと、木曜（出馬表の発表）に2回、
#     JRA 公式サイトから最新のデータを取り込み、変わったときだけ公開し直す（schedule は既定ブランチでだけ動く）
#   - main への push と手動実行（Run workflow）でも公開する
#   - 前回公開した data.json を引き継ぐので、サーバーもデータベースもなしで過去4開催日の結果が貯まっていく
#
# 初回だけ：リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にする
# （configure-pages が自動で有効にできなかった場合）。公開先は https://<ユーザー名>.github.io/keib/
name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 0-8 * * 0,1,6' # 土日月 9:00〜17:59 JST
    - cron: '*/30 9-14 * * 0,5,6' # 金土日 18:00〜23:59 JST（前日発売のオッズ）
    - cron: '5 3,9 * * 4' # 木 12:05・18:05 JST（出馬表の発表）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      updated: ${{ steps.data.outputs.updated }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 前回公開したデータを引き継ぐ
        run: |
          mkdir -p prev
          if curl -fsSL "$PAGES_URL/data.json" -o prev/data.json; then echo "前回の data.json を取得"; else echo "前回のデータなし（初回）"; fi
          curl -fsSL "$PAGES_URL/live.json" -o prev/live.json || true
      - name: JRA から実データを取り込む
        id: data
        run: |
          args=""
          [ -s prev/data.json ] && args="--previous prev/data.json"
          [ "${{ github.event_name }}" = "schedule" ] && args="$args --skip-if-idle"
          node scripts/build-data.mjs $args | tee build-data.log
          if grep -q 'IDLE' build-data.log; then echo "updated=false" >> "$GITHUB_OUTPUT"; else echo "updated=true" >> "$GITHUB_OUTPUT"; fi
      - name: テストとビルド
        if: steps.data.outputs.updated == 'true'
        run: |
          npm test
          npm run build
          # リアルタイム版（live ワークフロー）の案内が有効なら残す
          node -e '
            const fs = require("fs");
            try {
              const l = JSON.parse(fs.readFileSync("prev/live.json", "utf8"));
              if (Date.parse(l.until) > Date.now()) fs.writeFileSync("dist/live.json", JSON.stringify(l));
            } catch {}
          '
          ls -la dist
      - uses: actions/configure-pages@v5
        if: steps.data.outputs.updated == 'true'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.data.outputs.updated == 'true'
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.updated == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
