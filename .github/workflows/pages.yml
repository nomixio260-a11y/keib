# GitHub Pages に、実データ（JRA の出馬表・オッズ・結果）つきで公開する。
#
#   - 既定ブランチへの push と手動実行（Run workflow）で公開する（アプリ本体の更新用）
#   - 開催日のデータの更新は race-day.yml が data ブランチに data.json を push し、画面がそれを読む
#     （GitHub の schedule は 10分ごとの実行を頻繁に落とすため、Pages の公開し直しでは追いつかない）
#   - ビルド時は data ブランチ（なければ公開中）の data.json を引き継ぐので、過去の開催日の結果も残る
#
# 初回だけ：リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にする
# （configure-pages が自動で有効にできなかった場合）。公開先は https://<ユーザー名>.github.io/keib/
name: Pages

on:
  push:
    branches: [main, ccr-5f5023aa-ovwgr9]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      updated: ${{ steps.data.outputs.updated }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 前回公開したデータを引き継ぐ
        run: |
          mkdir -p prev
          if curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/data.json" -o prev/data.json; then echo "data ブランチの data.json を取得"
          elif curl -fsSL "$PAGES_URL/data.json" -o prev/data.json; then echo "公開中の data.json を取得"; else echo "前回のデータなし（初回）"; fi
          curl -fsSL "$PAGES_URL/live.json" -o prev/live.json || true
      - name: JRA から実データを取り込む
        id: data
        run: |
          args=""
          [ -s prev/data.json ] && args="--previous prev/data.json"
          [ "${{ github.event_name }}" = "schedule" ] && args="$args --skip-if-idle"
          node scripts/build-data.mjs $args | tee build-data.log
          if grep -q 'IDLE' build-data.log; then echo "updated=false" >> "$GITHUB_OUTPUT"; else echo "updated=true" >> "$GITHUB_OUTPUT"; fi
      - name: テストとビルド
        if: steps.data.outputs.updated == 'true'
        run: |
          npm test
          npm run build
          # リアルタイム版（live ワークフロー）の案内が有効なら残す
          node -e '
            const fs = require("fs");
            try {
              const l = JSON.parse(fs.readFileSync("prev/live.json", "utf8"));
              if (Date.parse(l.until) > Date.now()) fs.writeFileSync("dist/live.json", JSON.stringify(l));
            } catch {}
          '
          ls -la dist
      - uses: actions/configure-pages@v5
        id: pages
        if: steps.data.outputs.updated == 'true'
        continue-on-error: true
        with:
          enablement: true
      - name: GitHub Pages が有効でないときの案内
        if: steps.pages.outcome == 'failure'
        run: |
          {
            echo "## GitHub Pages がまだ有効になっていません"
            echo
            echo "リポジトリの **Settings → Pages → Build and deployment → Source** を **GitHub Actions** にしてから、もう一度 **Run workflow** を実行してください（最初の1回だけ）。"
            echo
            echo "JRA からのデータ取り込みとビルドは成功しています。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::GitHub Pages が有効になっていません。Settings → Pages → Source を「GitHub Actions」にしてから再実行してください。"
          exit 1
      - uses: actions/upload-pages-artifact@v3
        if: steps.data.outputs.updated == 'true'
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.updated == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
